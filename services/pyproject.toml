[project]
name = "a2a-agentic-home"
version = "0.1.0"
description = "Extension of Smart Home via A2A: Device Gateway (virtual home), Event Collector, Agent Hub and Studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",  # [standard] brings a WebSocket library
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
  "python-dotenv>=1",  # scripts/verify_integration.py --env-file
  "sqlalchemy>=2.0",  # Agent Hub and Studio tables (PostgreSQL in Docker, SQLite elsewhere)
  "psycopg[binary]>=3.2",
  "langchain-core>=1.0",  # Studio: structured output from the LLM
  "langchain-openai>=1.0",  # Studio: OpenAI-compatible chat API (OpenRouter)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.setuptools]
packages = ["common", "homeconfig", "gateway", "collector", "agenthub", "studio"]

[tool.setuptools.package-data]
studio = ["guides/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
