[project]
name = "a2a-agentic-home"
version = "0.1.0"
description = "A2A based Agentic Home: cross-device context sharing and room-level control via Ambient-A2A"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk[http-server,fastapi,sqlite]>=1.2,<1.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.setuptools]
packages = ["ambient", "homeconfig", "agents", "gateway", "collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
