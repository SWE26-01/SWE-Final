# Disclosure, automation and request policies (plan doc 4.1, 4.3, 4.4, 5.1).
# Loaded and checked by homeconfig.load_config().
#
# Condition: {source: <agent>, field, equals}  shared context from another agent
#            {space: <space>, field, equals}   room state (occupied, temperature, illuminance, sleeping)
#            {all: [...]} / {any: [...]}
# Action:    {device, command, params?}            device this agent owns
#            {request: <owner>, device, command}   ask the owner via device.control

disclosure:  # provider -> requester -> readable fields
  desktop-user1:
    my-room-user1: [meeting_app_active, meeting_start_at, pc_state]
    home-agent: [pc_state]
  mobile-user1:
    my-room-user1: [presence, moving]
    home-agent: [presence]

agents:
  my-room-user1:
    automation:
      - when: {source: desktop-user1, field: meeting_app_active, equals: true}
        then:
          - {device: my_room_light, command: SET_MODE, params: {mode: meeting}}
          - {request: home-agent, device: robot_vacuum, command: PAUSE}
      - when:
          all:
            - {source: desktop-user1, field: pc_state, equals: "OFF"}
            - {space: my_room, field: occupied, equals: false}
        then:
          - {device: my_room_light, command: TURN_OFF}
          - {device: my_room_ac, command: TURN_OFF}
      - when: {source: mobile-user1, field: presence, equals: AWAY}
        then:
          - {device: my_room_light, command: TURN_OFF}
          - {device: my_room_ac, command: TURN_OFF}
    requests:
      # P0 stand-in for the Baby Room refusal in scenario B
      - device: my_room_ac
        command: TURN_OFF
        deny_if: {space: my_room, field: occupied, equals: true}
        reason: OCCUPIED

  home-agent:
    requests:
      - {device: robot_vacuum, from: my-room-user1, allow: [PAUSE, RESUME]}

  baby-room-agent:  # P1
    requests:
      - device: baby_room_ac
        command: TURN_OFF
        deny_if: {space: baby_room, field: sleeping, equals: true}
        reason: SAFETY_POLICY
