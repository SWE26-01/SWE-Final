# Per-agent automation rules and request policies (plan doc 4.1, 4.3, 5.1).
# Format is a draft — finalize in W0-3.
disclosure:            # who may read which fields from a provider
  desktop-user1:
    my-room-user1: [meeting_app_active, meeting_start_at, pc_state]
    home-agent: [pc_state]
  mobile-user1:
    my-room-user1: [presence, moving]
    home-agent: [presence]

agents:
  my-room-user1:
    automation:
      - when: {source: desktop-user1, field: meeting_app_active, equals: true}
        then:
          - {device: my_room_light, command: SET_MODE, params: {mode: meeting}}
          - {request: home-agent, device: robot_vacuum, command: PAUSE}
      - when: {all: [{source: desktop-user1, field: pc_state, equals: "OFF"}, {space: my_room, field: occupied, equals: false}]}
        then:
          - {device: my_room_light, command: TURN_OFF}
          - {device: my_room_ac, command: TURN_OFF}
      - when: {source: mobile-user1, field: presence, equals: AWAY}
        then:
          - {device: my_room_light, command: TURN_OFF}
          - {device: my_room_ac, command: TURN_OFF}
    requests:
      - {device: my_room_ac, command: TURN_OFF, deny_if: {space: my_room, field: occupied, equals: true}, reason: OCCUPIED}
  home-agent:
    requests:
      - {from: my-room-user1, device: robot_vacuum, allow: [PAUSE, RESUME]}
  baby-room-agent:     # P1
    requests:
      - {device: baby_room_ac, command: TURN_OFF, deny_if: {state: sleeping}, reason: SAFETY_POLICY}
