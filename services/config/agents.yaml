# Who may call the Gateway and the Event Collector. Loaded and checked by homeconfig.load_config().
#
# Tokens are not stored here: each entry names the environment variable that holds it, so the
# services run with the root .env (`--env-file ../.env`). An optional `url` is the agent's A2A base
# URL; the Collector checks its Agent Card there.
agents:
  home: {token_env: AMBIENT_TOKEN_HOME}  # owner of the living-room devices

# Dashboards: read device states and events, command nothing.
operators:
  dashboard: {token_env: DASHBOARD_TOKEN}
