# Who may call the Gateway and the Event Collector. Loaded and checked by homeconfig.load_config().
#
# Agent ids and URLs match ../agents/shared.json5 `peers`. Tokens are not stored here: each
# entry names the environment variable that holds it, so the services run with the root .env
# (`--env-file ../.env`).
agents:
  desktop: {token_env: AGENT_TOKEN_DESKTOP, url: "http://127.0.0.1:18800/plugins/a2a"}
  smartphone: {token_env: AGENT_TOKEN_SMARTPHONE, url: "http://127.0.0.1:18920/plugins/a2a"}
  root: {token_env: AGENT_TOKEN_ROOT, url: "http://127.0.0.1:19040/plugins/a2a"}
  room1: {token_env: AGENT_TOKEN_ROOM1, url: "http://127.0.0.1:19160/plugins/a2a"}
  room2: {token_env: AGENT_TOKEN_ROOM2, url: "http://127.0.0.1:19280/plugins/a2a"}
  kitchen: {token_env: AGENT_TOKEN_KITCHEN, url: "http://127.0.0.1:18680/plugins/a2a"}

# Dashboards: read device states and events, command nothing.
operators:
  dashboard: {token_env: DASHBOARD_TOKEN}

# The home user on the Studio and Hub screens: creates agents, approves and revokes connections.
# Commands no devices. Optional: without HOME_USER_TOKEN, Studio and Hub stay read-only.
users:
  home_user: {token_env: HOME_USER_TOKEN}

# Backend services calling each other: Studio registers the agents it creates in the Hub.
# Optional: without STUDIO_TOKEN, Studio can draft agents but not register them.
# runtime: the Gateway and the Collector ask the Hub which Hub-issued token is whose and who owns
# each device (POST /tokens/verify, GET /ownership); the Hub uses it to start and stop agents in the
# agents container (scripts/launcher.mjs). Optional: without RUNTIME_TOKEN the Hub is not consulted.
services:
  studio: {token_env: STUDIO_TOKEN}
  runtime: {token_env: RUNTIME_TOKEN}
