# Home Assistant entities and the one agent that may command each. Loaded and checked by
# homeconfig.load_config(). Must match ../homeassistant/config/configuration.yaml.
#
# An agent commands only the devices it owns; other agents ask the owner over A2A. The Gateway
# enforces this table itself, so a bug in another caller cannot move a device.
spaces: [living_room]

devices:
  - {entity: input_boolean.living_occupied, space: living_room, owner: home}
  - {entity: input_number.living_temperature, space: living_room, owner: home}
  - {entity: input_boolean.living_light, space: living_room, owner: home}
  - {entity: input_number.living_light_brightness, space: living_room, owner: home}
  - {entity: input_boolean.living_ac, space: living_room, owner: home}
  - {entity: input_number.living_ac_target, space: living_room, owner: home}
  - {entity: input_boolean.living_tv, space: living_room, owner: home}
