# Desktop Agent runs on the host (needs real PC state); everything else runs here.
# Agent services are added as they are implemented (W2-5).
services:
  gateway:
    build: .
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8100
    ports: ["8100:8100"]
  collector:
    build: .
    command: uvicorn collector.main:app --host 0.0.0.0 --port 8200
    ports: ["8200:8200"]
