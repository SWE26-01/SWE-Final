# Device Gateway, Event Collector and Runner. Tokens, HA_URL and HA_TOKEN come from the root .env
# (scripts/setup.sh writes it). Set AMBIENT_ENV to use another file.
# The Runner needs SIMULATOR_TOKEN and OPENCLAW_GATEWAY_TOKEN; without them it exits and the other
# two keep running.
services:
  gateway:
    build: .
    command: uvicorn gateway.main:build --factory --host 0.0.0.0 --port 8100
    env_file: ${AMBIENT_ENV:-../.env}
    environment:
      HA_URL: http://host.docker.internal:8123  # ../homeassistant container, published on the host
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8100:8100"]
  collector:
    build: .
    command: uvicorn collector.main:build --factory --host 0.0.0.0 --port 8200
    env_file: ${AMBIENT_ENV:-../.env}
    environment:
      COLLECTOR_DB: /data/collector.sqlite
      AMBIENT_AGENTS_HOST: host.docker.internal  # reach the agents' cards on the host
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["collector-data:/data"]
    ports: ["8200:8200"]
  runner:
    build: .
    command: uvicorn runner.main:build --factory --host 0.0.0.0 --port 8300
    env_file: ${AMBIENT_ENV:-../.env}
    environment:
      AMBIENT_AGENTS_HOST: host.docker.internal  # reach the agents' OpenClaw gateways on the host
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8300:8300"]

volumes:
  collector-data:
