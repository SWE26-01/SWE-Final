    cards:
      - type: entities
        title: "주방"
        entities: [input_boolean.kitchen_light, input_boolean.kitchen_stove, input_boolean.kitchen_air, input_boolean.kitchen_hood]
      - type: entities
        title: "다이닝"
        entities: [input_boolean.dining_light]
      - type: entities
        title: "거실"
