- id: ambient_simulation_1
  alias: "시뮬레이션 1 실행"
  description: "프론트엔드 요청으로 요리부터 취침까지 시뮬레이션을 실행합니다."
  trigger:
    - platform: state
      entity_id: input_button.ambient_simulation_1
  action:
    - service: script.turn_on
      target: { entity_id: script.ambient_simulation_1 }
  mode: restart

