name: services
on:
  pull_request:
    paths: ["services/**", ".github/workflows/services.yml"]
  push:
    branches: [main]
    paths: ["services/**", ".github/workflows/services.yml"]
defaults:
  run:
    working-directory: services
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: contracts are up to date
        run: |
          python scripts/export_schemas.py
          git diff --exit-code contracts/
