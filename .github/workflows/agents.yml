name: agents
on:
  pull_request:
    paths: ["agents/ambient-a2a-plugin/**", ".github/workflows/agents.yml"]
  push:
    branches: [main]
    paths: ["agents/ambient-a2a-plugin/**", ".github/workflows/agents.yml"]
defaults:
  run:
    working-directory: agents/ambient-a2a-plugin
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
